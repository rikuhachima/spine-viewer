<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fribbels Spine Viewer</title>
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.23/dist/iife/spine-player.min.js"></script>
    <link
        rel="stylesheet"
        href="https://unpkg.com/@esotericsoftware/spine-player@4.1.23/dist/spine-player.min.css"
    >
    <style>
        body {
            margin: 0;
            background: #222;
        }
        #player {
            width: 100vw;
            height: 100vh;
        }
        #status {
            position: absolute;
            top: 70px;
            left: 20px;
            z-index: 10;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            font-size: 13px;
            font-family: monospace;
            max-width: 90vw;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div id="player"></div>
<button onclick="recordSpine()"
style="
position:absolute;
top:20px;
left:20px;
z-index:10;
padding:10px;
font-size:18px;
">
Record 10s
</button>
<div id="status"></div>

<script>
// Library fix-webm-duration disematkan langsung (bukan dari CDN)
// supaya tidak gagal dimuat. Diringkas dari yusitnikov/fix-webm-duration.
function ysFixWebmDuration(blob, duration, callback) {
    var reader = new FileReader();
    reader.onload = function() {
        var buffer = new Uint8Array(reader.result);
        var fixed = fixWebmBuffer(buffer, duration);
        var fixedBlob = new Blob([fixed], { type: blob.type });
        callback(fixedBlob);
    };
    reader.readAsArrayBuffer(blob);
}

function fixWebmBuffer(buffer, duration) {
    var doubleToString = function(num) {
        var buf = new ArrayBuffer(8);
        new DataView(buf).setFloat64(0, num);
        return Array.from(new Uint8Array(buf)).map(b => String.fromCharCode(b)).join('');
    };
    var bufferStr = Array.from(buffer).map(b => String.fromCharCode(b)).join('');
    var durationIndex = bufferStr.indexOf('\x44\x89');
    if (durationIndex < 0) return buffer;
    var durationStr = doubleToString(duration);
    var out = new Uint8Array(buffer);
    var writeAt = durationIndex + 3;
    for (var i = 0; i < 8; i++) {
        out[writeAt + i] = durationStr.charCodeAt(i);
    }
    return out;
}

const statusEl = document.getElementById("status");
function log(msg) {
    statusEl.textContent += msg + "\n";
}

const player = new spine.SpinePlayer("player", {
    binaryUrl: "1505.skel",
    atlasUrl: "1505HD.atlas",
    showControls: true,
    alpha: true,
    backgroundColor: "0000FF",
    premultipliedAlpha: false,
    preserveDrawingBuffer: true,
    success: function(player) {
        log("Spine dimuat");
        const canvas = document.querySelector("canvas");

        window.recordSpine = function(){
            statusEl.textContent = "";
            log("Merekam...");
            // rekam di resolusi rendah dulu untuk tes beban
            let recordCanvas = document.createElement("canvas");
            recordCanvas.width = 480;
            recordCanvas.height = 480;
            let rctx = recordCanvas.getContext("2d");
            let drawInterval = setInterval(() => {
                rctx.drawImage(canvas, 0, 0, recordCanvas.width, recordCanvas.height);
            }, 1000/24);

            let stream = recordCanvas.captureStream(24);
            let recorder = new MediaRecorder(stream,{
                mimeType:"video/webm;codecs=vp8",
                videoBitsPerSecond:2500000
            });
            let chunks = [];
            let startTime = Date.now();

            recorder.ondataavailable = e => {
                if(e.data.size > 0){
                    chunks.push(e.data);
                    log("detik " + chunks.length + ": +" + (e.data.size/1024).toFixed(1) + " KB");
                } else {
                    log("detik " + (chunks.length+1) + ": 0 KB (tidak ada data baru!)");
                }
            };

            recorder.onstop = () => {
                clearInterval(drawInterval);
                let duration = Date.now() - startTime;
                let buggyBlob = new Blob(chunks,{ type:"video/webm" });
                log("Ukuran video: " + (buggyBlob.size/1024/1024).toFixed(2) + " MB");
                log("Durasi tercatat: " + duration + " ms");

                ysFixWebmDuration(buggyBlob, duration, function(fixedBlob){
                    log("Fix durasi selesai, ukuran akhir: " + (fixedBlob.size/1024/1024).toFixed(2) + " MB");
                    let url = URL.createObjectURL(fixedBlob);
                    let a = document.createElement("a");
                    a.href = url;
                    a.download = "1505-animation.webm";
                    a.click();
                    log("Download dimulai.");
                });
            };

            recorder.start(1000);
            setTimeout(()=>{
                recorder.stop();
            },10000);
        };
    },
    error: function(player, error) {
        log("ERROR: " + error);
    }
});
</script>
</body>
</html>
